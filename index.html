<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2a2e" />
  <title>Accordeur et métronome</title>
</head>
<body>
  <main>
    <nav role="tablist" aria-label="Outils">
      <button role="tab" id="onglet-metro" aria-selected="true">Métronome</button>
      <button role="tab" id="onglet-accord" aria-selected="false">Accordeur</button>
      <button role="tab" id="onglet-tonal" aria-selected="false">Tonalité</button>
      <button role="tab" id="onglet-cercle" aria-selected="false">Cercle</button>
    </nav>

    <section id="vue-metro">
      <div class="tempo">
        <button id="moins" aria-label="Ralentir de 1">−</button>
        <div><output id="bpm">100</output><span>pulsations par minute</span></div>
        <button id="plus" aria-label="Accélérer de 1">+</button>
      </div>
      <input id="curseur" type="range" min="30" max="240" value="100" aria-label="Tempo" />
      <label class="mesure">Mesure
        <select id="mesure">
          <option value="2">2/4</option>
          <option value="3">3/4</option>
          <option value="4" selected>4/4</option>
          <option value="6">6/8</option>
        </select>
      </label>
      <div id="temps" aria-hidden="true"></div>
      <button id="jouer" class="jouer">Démarrer</button>
    </section>

    <section id="vue-accord" hidden>
      <p id="note" class="note" aria-live="polite">–</p>
      <p id="etat" class="etat" aria-live="polite">Joue une corde de guitare</p>
      <div class="jauge" aria-hidden="true">
        <span class="milieu"></span>
        <span id="aiguille" class="aiguille"></span>
      </div>
      <ul id="cordes" class="cordes"></ul>
      <button id="micro" class="jouer">Activer le micro</button>
      <p id="erreur" class="erreur" role="alert" hidden></p>
    </section>

    <section id="vue-tonal" hidden>
      <p id="tonalite" class="tonalite" aria-live="polite">–</p>
      <p id="tonal-etat" class="etat" aria-live="polite">Chante, joue ou mets de la musique près du micro</p>
      <progress id="progres" max="100" value="0" hidden></progress>
      <p id="autres" class="autres" hidden></p>
      <button id="ecouter" class="jouer">Écouter 10 secondes</button>
      <p id="erreur-tonal" class="erreur" role="alert" hidden></p>
    </section>

    <section id="vue-cercle" hidden>
      <svg id="cadran" viewBox="0 0 300 300" role="img" aria-label="Cadran des demi-tons, de -12 à +12">
        <circle class="anneau" cx="150" cy="150" r="105" />
        <g id="graduations"></g>
        <g id="aiguille-c" transform="rotate(0 150 150)">
          <line class="trait" x1="150" y1="112" x2="150" y2="50" />
          <circle class="pointe" cx="150" cy="50" r="6" />
        </g>
        <text id="c-note" class="c-note" x="150" y="158" text-anchor="middle">–</text>
        <text id="c-decalage" class="c-dec" x="150" y="186" text-anchor="middle"></text>
      </svg>
      <p id="c-etat" class="etat" aria-live="polite">Appuie sur « Écouter », puis chante une note : ce sera le 00</p>
      <button id="c-ecouter" class="jouer">Écouter</button>
      <button id="c-zero">Nouveau 00</button>
      <p id="c-erreur" class="erreur" role="alert" hidden></p>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
