<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2a2e" />
  <title>Accordeur et métronome</title>
</head>
<body>
  <main>
    <nav role="tablist" aria-label="Outils">
      <button role="tab" id="onglet-metro" aria-selected="true">Métronome</button>
      <button role="tab" id="onglet-accord" aria-selected="false">Accordeur</button>
    </nav>

    <section id="vue-metro">
      <div class="tempo">
        <button id="moins" aria-label="Ralentir de 1">−</button>
        <div><output id="bpm">100</output><span>pulsations par minute</span></div>
        <button id="plus" aria-label="Accélérer de 1">+</button>
      </div>
      <input id="curseur" type="range" min="30" max="240" value="100" aria-label="Tempo" />
      <label class="mesure">Mesure
        <select id="mesure">
          <option value="2">2/4</option>
          <option value="3">3/4</option>
          <option value="4" selected>4/4</option>
          <option value="6">6/8</option>
        </select>
      </label>
      <div id="temps" aria-hidden="true"></div>
      <button id="jouer" class="jouer">Démarrer</button>
    </section>

    <section id="vue-accord" hidden>
      <p id="note" class="note" aria-live="polite">–</p>
      <p id="etat" class="etat" aria-live="polite">Joue une corde de guitare</p>
      <div class="jauge" aria-hidden="true">
        <span class="milieu"></span>
        <span id="aiguille" class="aiguille"></span>
      </div>
      <ul id="cordes" class="cordes"></ul>
      <button id="micro" class="jouer">Activer le micro</button>
      <p id="erreur" class="erreur" role="alert" hidden></p>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
